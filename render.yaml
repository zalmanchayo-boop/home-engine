services:
  - type: web
    name: home-engine
    runtime: docker
    plan: 0.5c-512mb       # $7/mo (formerly "starter"); persistent disks require a paid instance
    region: virginia
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_PASSWORD
        generateValue: true  # read it in Render dashboard > Environment
      - key: BOOKING_URL
        value: https://calendar.app.google/u9foEt42dhmBc4er9
      - key: NATIONAL_RATE_FEED_URL
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
